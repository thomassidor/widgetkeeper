<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <!-- qrcode-generator (MIT), bundled by `npm run qr-code`: a screen's address as a QR code. -->
  <script type="text/javascript" src="qrcode.js"></script>
  <!-- The cards themselves, shared with the web dashboards' Settings dialog. -->
  <script type="text/javascript" src="app-settings.js"></script>
  <link rel="stylesheet" href="app-settings.css">
  <style>
    /* Homey's settings stylesheet frames no section and has no help-text style (no `homey-form-help`), so the page
       draws its own: each section a card folded to its title and a line of where it stands. */
    .card { margin: 0 0 var(--homey-su-2, 16px); border: 1px solid var(--homey-color-line, #DDDEE2); border-radius: var(--homey-border-radius, 10px); }
    .card > summary {
      display: flex; align-items: center; gap: 12px; padding: 16px; cursor: pointer; list-style: none;
      -webkit-tap-highlight-color: transparent;
    }
    .card > summary::-webkit-details-marker { display: none; }
    .card > summary::after {
      content: ''; flex: none; width: 9px; height: 9px; margin: 0 4px 4px 0;
      border-right: 2px solid var(--homey-color-mono-40, #939496); border-bottom: 2px solid var(--homey-color-mono-40, #939496);
      transform: rotate(45deg);
    }
    .card[open] > summary::after { margin: 4px 4px 0 0; transform: rotate(-135deg); }
    .card-titles { flex: 1 1 auto; min-width: 0; }
    .card-title { display: block; font-size: 17px; line-height: 24px; font-weight: var(--homey-font-weight-bold, 700); color: var(--homey-color-text, #1F2029); }
    .card-line {
      display: block; margin-top: 2px; font-size: 14px; line-height: 20px; color: var(--homey-color-mono-50, #7A7B7D);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-line.ok::before { content: '✓ '; font-weight: 700; color: #2B8A00; }
    .card-body { padding: 0 16px 16px; }
    .card-body > :first-child { margin-top: 0; }
    label.homey-form-checkbox { margin: 12px 0 0; }
    .homey-form-group { margin: 12px 0 0; }
    [hidden] { display: none !important; }
    /* Homey greys only `disabled="disabled"`; a button disabled from script has `disabled=""`. */
    [class*='homey-button']:disabled { filter: grayscale(1) opacity(0.5); cursor: not-allowed; }
  </style>
</head>
<body>
  <!-- The cards (`app-settings.js`), each folded to its title and a line of where it stands. -->
  <div id="cards"></div>
  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const cards = window.WidgetkeeperAppSettings.cards(Homey);
      const root = document.getElementById('cards');
      for (const card of cards) {
        const details = document.createElement('details');
        details.className = 'card';
        details.id = card.id;
        const summary = document.createElement('summary');
        const titles = document.createElement('span');
        titles.className = 'card-titles';
        const title = document.createElement('span');
        title.className = 'card-title';
        title.textContent = Homey.__(`settings.${card.title}`);
        titles.append(title, card.line);
        summary.append(titles);
        details.append(summary, card.body);
        details.addEventListener('toggle', () => { if (details.open) card.opened(); });
        root.append(details);
      }
      Homey.ready();
    }
  </script>
</body>
</html>
