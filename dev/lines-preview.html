<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lines widget preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/spacer/public/kit.css">
  <link rel="stylesheet" href="../widgets/electricity/public/chart.css">
  <link rel="stylesheet" href="../widgets/lines/public/widget.css">
  <script src="../widgets/spacer/public/kit.js"></script>
  <script src="../widgets/electricity/public/chart.js"></script>
  <script src="../widgets/lines/public/widget.js"></script>
  <script src="mock-lines.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="preview.css">
  <style>
    .card { background: var(--homey-background-color, #1F2029); border-radius: 20px; padding: 16px; box-sizing: border-box; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
    .light { color: var(--ew-text); }
  </style>
</head>
<body>
  <div class="col"><span>358 px (phone) · dark · 24 hours · four rooms</span><div class="card homey-dark-mode" style="width:358px"><div id="u1"></div></div></div>
  <div class="col"><span>358 px · light · areas · smooth · legend below</span><div class="card light" style="width:358px"><div id="u2"></div></div></div>
  <div class="col"><span>300 px · dark · Vivid · six rooms · tapped on load</span><div class="card homey-dark-mode" style="width:300px"><div id="u3"></div></div></div>
  <div class="col"><span>358 px · dark · yesterday (averages) · from zero</span><div class="card homey-dark-mode" style="width:358px"><div id="u4"></div></div></div>
  <div class="col"><span>358 px · dark · 7 days · a missing value</span><div class="card homey-dark-mode" style="width:358px"><div id="u5"></div></div></div>
  <div class="col"><span>358 px · nothing picked</span><div class="card homey-dark-mode" style="width:358px"><div id="u6"></div></div></div>

  <script>
    const make = (id, opts, state) => {
      const w = createLinesWidget(document.getElementById(id), { t: devT, language: 'en', count: state ? state.length : 1, ...opts });
      if (state) w.setState(state);
      return w;
    };
    make('u1', {}, mockLines.linesState());
    make('u2', { style: 'area', smooth: true, legend: 'below' }, mockLines.linesState());
    const six = mockLines.linesState().concat(mockLines.linesState().slice(0, 2).map((s, i) => ({ ...s, deviceId: `x${i}`, name: ['Bathroom', 'Hall'][i], points: s.points.map(([t, v]) => [t, Math.round((v + [2.4, -2.6][i]) * 10) / 10]) })));
    make('u3', { colorStyle: 'deep' }, six);
    const svg = document.querySelector('#u3 svg');
    const r = svg.getBoundingClientRect();
    svg.dispatchEvent(new PointerEvent('pointerdown', { clientX: r.left + 38 + 258 * 0.8, clientY: r.top + 50, pointerType: 'mouse' }));
    make('u4', { span: '1d!-', range: 'zero' }, mockLines.linesState('1d!-'));
    make('u5', { count: 3, span: '7d' }, (() => { const s = mockLines.linesState('7d', Date.now(), 3); s[1] = { deviceId: 'gone', capabilityId: 'measure_temperature', missing: true }; return s; })());
    const empty = make('u6', {});
    empty.setMessage(empty.t('selectValues'));
  </script>
</body>
</html>
