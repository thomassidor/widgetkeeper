  <script>
    // Dark, whatever the browser's colour scheme (the front page follows it; the dashboards are set to dark).
    const realMatchMedia = window.matchMedia.bind(window);
    window.matchMedia = (q) => (/prefers-color-scheme:\s*dark/.test(q)
      ? { matches: true, media: q, addEventListener() {}, removeEventListener() {}, addListener() {}, removeListener() {} }
      : realMatchMedia(q));

    // The showcase dashboards as web dashboards, each on a backdrop of its own; each widget keeps its showcase entry
    // (with the dashboard's colour style) for the mount. Home's first column has Dashboard Shortcuts, as a menu, in
    // place of the heat pump (Flow Buttons stays third, for the settings view).
    const BACKGROUND = { home: 'plum', energy: 'forest', security: 'slate', climate: 'ocean', livingroom: 'berry', garden: 'forest', kitchen: 'sand' };
    const MENU = [['home', 'purple', 'home'], ['energy', 'green', 'bolt'], ['security', 'red', 'shield'], ['climate', 'blue', 'thermometer']];
    const shortcuts = {
      type: 'shortcuts', current: 'home',
      opts: { columns: '2', tiles: MENU.map(([, color, icon]) => ({ color, icon })) },
      dashboards: MENU.map(([id]) => ({ id, name: SHOWCASE[id].title })),
    };
    const webColumns = (id, board) => (id === 'home'
      ? board.columns.map((column, c) => (c === 0 ? [shortcuts, ...column.filter(w => w.type !== 'thermostat')] : column))
      : board.columns);
    const LIGHT_BOARD = 'kitchen';
    const ENTRY = new Map();
    const BOARDS = Object.entries(SHOWCASE).map(([id, board]) => ({
      id, name: board.title, theme: id === LIGHT_BOARD ? 'light' : 'dark', background: BACKGROUND[id] || 'default',
      columns: webColumns(id, board).map((column, c) => column.map((w, i) => {
        const wid = `${id}-${c}-${i}`;
        ENTRY.set(wid, board.colorStyle ? { ...w, opts: { colorStyle: board.colorStyle, ...w.opts } } : w);
        return { id: wid, type: w.type, title: '', settings: {}, deviceIds: [] };
      })),
    }));
    const params = new URLSearchParams(location.search);
    const VIEW = params.get('v') || 'dashboard';
    // The wide view (1.1.0's wide widgets): Energy with its chart across the last two columns, at their top, so both
    // columns' own widgets show under it.
    const WIDE_BOARD = 'energy';
    if (VIEW === 'wide') Object.assign(BOARDS.find(b => b.id === WIDE_BOARD).columns[1][0], { span: 2, at: [0] });
    // The popup view: Security with a Flow's question over it, the hallway camera's made-up picture (cameras/door.webp)
    // as its picture.
    const POPUP_BOARD = 'security';
    // The preview view (1.2.0's live preview): Energy in the editor with a Chart · Scatter (XY) on top of its last column,
    // the heat pump's power against the outdoor temperature over 7 days (mock-scatter.js, as in the README screenshot),
    // its settings open beside its preview.
    const PREVIEW_BOARD = 'energy';
    const PREVIEW_WIDGET = 'energy-2-scatter';
    if (VIEW === 'preview') {
      const slot = (id, name, description) => ({ id, name, description });
      BOARDS.find(b => b.id === PREVIEW_BOARD).columns[2].unshift({
        id: PREVIEW_WIDGET, type: 'scatter', title: '', deviceIds: [],
        settings: {
          xValue: slot('outdoor:measure_temperature', 'Outdoor sensor · Temperature', 'Garden · °C'),
          yValue: slot('heatpump:measure_power', 'Heat pump · Power', 'Utility room · kW'),
          count: 7, span: 'days', leaveOut: false, dots: 'auto', trend: true, fade: true, title: '', showHeader: true, color: 'blue', colorStyle: 'soft',
        },
      });
      ENTRY.set(PREVIEW_WIDGET, { opts: { span: '7d' }, state: mockScatter.scatterState('7d', Date.now()) });
    }
    // The sync and copy views (1.2.0): Energy in the editor, with its Sync dialog (linked with the Homey dashboard
    // Energy, synced 12 minutes ago) or Copy to… for its Chart · Basic, Home picked. The kiosk view: Home with
    // `?kiosk=1`, the browser drawn as a wall tablet.
    const SYNC_BOARD = 'energy';
    const COPY_WIDGET = 'Chart · Basic';
    const COPY_TO = 'Home';
    if (VIEW === 'kiosk' && !params.has('kiosk')) history.replaceState(null, '', `${location.pathname}${location.search}&kiosk=1${location.hash}`);
    const BOARD = VIEW === 'light' ? LIGHT_BOARD : VIEW === 'wide' ? WIDE_BOARD : VIEW === 'popup' ? POPUP_BOARD
      : VIEW === 'preview' ? PREVIEW_BOARD : VIEW === 'sync' || VIEW === 'copy' ? SYNC_BOARD : params.get('d') || 'home';
    const HASH = VIEW === 'front' ? '#/' : VIEW === 'nightly' ? '#/edit' : ['editor', 'settings', 'preview', 'sync', 'copy'].includes(VIEW) ? `#/d/${BOARD}/edit` : `#/d/${BOARD}`;

    // The settings, preview and popup views draw their dialog inside the window: shown non-modal over a backdrop of its
    // own, since a modal one sits over the whole render. The settings view: Home's Flow Buttons with four buttons, in its
    // settings and drawn alike behind the dialog (the showcase's has two).
    const SETTINGS_WIDGET = 'home-0-2';
    if (['settings', 'preview', 'popup', 'sync', 'nightly', 'copy'].includes(VIEW)) {
      HTMLDialogElement.prototype.showModal = function () {
        this.show();
        const viewport = document.querySelector('.viewport');
        viewport.append(Object.assign(document.createElement('div'), { className: 'shot-backdrop' }), this);
      };
    }
    if (VIEW === 'settings') {
      const flows = BOARDS.find(b => b.id === 'home').columns.flat().find(w => w.id === SETTINGS_WIDGET);
      const buttons = [['Good night', 'purple', 'moon', 'Moon'], ['Good morning', 'yellow', 'sun', 'Sun'], ['Movie time', 'orange', 'tv', 'TV'], ['Leaving home', 'blue', 'leave', 'Leave']];
      flows.settings = { columns: '2', colorStyle: 'soft' };
      buttons.forEach(([name, color, icon, iconName], i) => Object.assign(flows.settings, {
        [`flow${i + 1}`]: { id: `flow:${i + 1}`, name }, [`color${i + 1}`]: color,
        [`icon${i + 1}`]: { id: icon, name: iconName }, [`name${i + 1}`]: '',
      }));
      ENTRY.set(SETTINGS_WIDGET, {
        ...ENTRY.get(SETTINGS_WIDGET),
        opts: { columns: '2', buttons: buttons.map(([, color, icon], i) => ({ id: `flow:${i + 1}`, color, icon })) },
        flows: buttons.map(([name], i) => ({ id: `flow:${i + 1}`, name, enabled: true, triggerable: true, advanced: false })),
      });
    }
    const popups = VIEW !== 'popup' ? [] : [{
      id: 'p1', token: 'showcase', target: 'all', createdAt: Date.now(), until: Date.now() + 60e3,
      kind: 'ask', text: 'Someone is at the front door. Unlock it?', buttons: ['Unlock', 'Not now'], picture: { source: 'camera' },
      image: fetch('cameras/door.webp').then(r => r.arrayBuffer()).then((buf) => {
        let bin = '';
        for (const b of new Uint8Array(buf)) bin += String.fromCharCode(b);
        return { type: 'image/webp', data: btoa(bin) };
      }),
    }];
    // The preview view's two values, for its pickers (mock-scatter.js's devices, readings at the render's time).
    const picks = VIEW !== 'preview' ? {} : {
      zones: { garden: ['Garden', null], utility: ['Utility room', null] },
      devices: [
        { id: 'outdoor', name: 'Outdoor sensor', zone: 'garden', class: 'sensor', capabilities: ['measure_temperature'], icon: null },
        { id: 'heatpump', name: 'Heat pump', zone: 'utility', class: 'heatpump', capabilities: ['measure_power'], icon: window.ICONS?.climate || null },
      ],
      readings: {
        measure_temperature: { title: 'Temperature', type: 'number', units: '°C', decimals: 1, min: null, max: null, values: null, value: 6.8 },
        measure_power: { title: 'Power', type: 'number', units: 'kW', decimals: 2, min: null, max: null, values: null, value: 1.49 },
      },
    };
    const noChanges = { added: 0, removed: 0, updated: 0, moved: false, renamed: false };
    const synced = (homeyId, minutes) => ({ homeyId, prefer: 'homey', syncing: false,
      lastSync: { at: Date.now() - minutes * 6e4, ok: true, conflicts: [], changes: { web: noChanges, homey: noChanges } } });
    const sync = VIEW === 'sync' ? { [SYNC_BOARD]: synced('h-energy', 12) }
      : VIEW === 'nightly' ? { [SYNC_BOARD]: synced('h-energy', 12), kitchen: synced('h-kitchen', 40) } : {};
    // The sync line's time on the 24-hour clock, as the showcase's widgets (en-GB) have it: the page's language is just `en`.
    if (VIEW === 'sync' || VIEW === 'nightly') {
      const time = Date.prototype.toLocaleTimeString;
      Date.prototype.toLocaleTimeString = function (lang, o) { return time.call(this, lang === 'en' ? 'en-GB' : lang, o); };
    }
    mockWebApi({ lang: 'en', dashboards: BOARDS, popups, sync, ...picks });
    history.replaceState(null, '', HASH);
  </script>

  <style>
    /* Transparent around the window: the render script screenshots with a transparent default background. */
    html { background: transparent !important; }
    body { margin: 0; padding: 24px 40px 64px; display: inline-block; background: transparent !important; font-family: Roboto, sans-serif; }

    /* The browser window: a dark title bar with the tab, then the toolbar with the address. */
    .window {
      width: 1440px; border-radius: 12px; overflow: hidden; background: #202124;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 30px 60px -16px rgba(0, 0, 0, 0.55), 0 10px 20px rgba(0, 0, 0, 0.25);
    }
    .tabs { display: flex; align-items: flex-end; gap: 14px; height: 42px; padding: 0 12px; background: #1B1C1F; }
    .lights { display: flex; gap: 8px; align-self: center; padding: 0 8px 0 4px; }
    .lights span { width: 12px; height: 12px; border-radius: 50%; }
    .lights span:nth-child(1) { background: #FF5F57; } .lights span:nth-child(2) { background: #FEBC2E; } .lights span:nth-child(3) { background: #28C840; }
    .tab {
      display: flex; align-items: center; gap: 10px; width: 260px; height: 34px; padding: 0 14px; box-sizing: border-box;
      border-radius: 10px 10px 0 0; background: #2A2B2F; color: #E8EAED; font-size: 13px;
    }
    .tab img { width: 16px; height: 16px; }
    .tab-title { flex: 1 1 auto; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tab-x, .tab-new { color: #9AA0A6; font-size: 16px; line-height: 1; }
    .tab-new { align-self: center; font-size: 20px; }
    .toolbar { display: flex; align-items: center; gap: 14px; height: 44px; padding: 0 14px; background: #2A2B2F; border-bottom: 1px solid #111217; }
    .toolbar svg { display: block; flex: none; }
    .address {
      flex: 1 1 auto; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 14px; border-radius: 16px;
      background: #1B1C1F; color: #9AA0A6; font-size: 14px; white-space: nowrap; overflow: hidden;
    }
    .address b { color: #E8EAED; font-weight: 400; }

    /* The light view: a light browser, and the light tokens Homey's stylesheet would give the page and its frames. */
    html:not(.homey-dark-mode) { --homey-background-color: #FFFFFF; --homey-text-color: #1F2029; --homey-text-color-light: #6B6C75; }
    .window.light { background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12), 0 30px 60px -16px rgba(0, 0, 0, 0.35), 0 10px 20px rgba(0, 0, 0, 0.15); }
    .light .tabs { background: #DEE1E6; }
    .light .tab { background: #FFFFFF; color: #1F1F1F; }
    .light .toolbar { background: #FFFFFF; border-bottom-color: #DADCE0; }
    .light .address { background: #F1F3F4; color: #5F6368; }
    .light .address b { color: #1F1F1F; }

    /* The page: 1440 × 860, anything taller cut off, like a page you'd scroll. */
    .viewport { position: relative; height: 860px; overflow: hidden; background: var(--wd-bg); }
    .viewport > .wd { min-height: 860px; }
    /* No socket in the render: no "No live updates". */
    .wd-live { display: none !important; }
    /* A non-transparent widget's frame: Homey's widget padding, as the widget's own body has in an iframe. */
    .wd-frame.card > .sc-body { padding: 16px; }
    .wd-frame.card > .sc-body.wp-body { padding: 0; }
    /* The settings view: the dialog inside the page, over a backdrop like a modal's. */
    .viewport.settings { height: 1040px; }
    .shot-backdrop { position: absolute; inset: 0; z-index: 9998; background: rgba(0, 0, 0, .5); }
    /* The sync, nightly and copy views are cropped close to their dialog (the render script's -dialog.png): the page
       behind dimmed more, and the nightly view's Settings only its sync section. */
    .crop .shot-backdrop { background: rgba(0, 0, 0, .7); }
    .crop .wd-page-settings .wd-page-section:not(:has(.wd-sync-time)) { display: none; }
    .crop .wd-page-settings .wd-page-section { border-top: 0; margin-top: 0; padding-top: 0; }
    .viewport > .wd-dialog { position: absolute; inset: 40px 0 auto; height: calc(100% - 80px); max-height: none; margin: 0 auto; z-index: 9999; box-shadow: 0 24px 64px rgba(0, 0, 0, .5); }
    /* The popup, sync and copy views: the dialog in the middle, as tall as it is, without the focus ring a script's focus() gives. */
    .viewport > .wd-dialog.wd-popup, .viewport > .wd-dialog.wd-sync-dialog, .viewport > .wd-dialog.wd-copy, .viewport > .wd-dialog.wd-page-settings { inset: 0; height: fit-content; margin: auto; }
    .viewport > .wd-dialog :focus-visible { outline: none; }
    /* The kiosk view: no browser around the page, a wall tablet's bezel instead (16:10, 1440 × 900). */
    .window.tablet { padding: 22px; border-radius: 40px; background: #0B0B0E; box-shadow: 0 0 0 2px #2A2B30, 0 30px 60px -16px rgba(0, 0, 0, 0.55), 0 10px 20px rgba(0, 0, 0, 0.25); }
    .window.tablet .tabs, .window.tablet .toolbar { display: none; }
    .window.tablet .viewport { height: 900px; border-radius: 14px; }
    .window.tablet .viewport > .wd { min-height: 900px; }
    .viewport > .wd-popup :focus-visible { outline: none; }
  </style>

  </div>

  <script>
    // The widgets drawn on Homey's default widget background get its dark frame, as in showcase.html.
    const FRAME = { thermostat: 'tw-frame', varpresets: 'tw-frame', media: 'mw-frame', weather: 'wf-frame', heatmap: 'hm-frame',
      keypad: 'kp-frame', pollen: 'pw-frame', webpage: 'wp-body' };
    mountWebDashboards(document.getElementById('app'), {
      mountWidget(w, wrap) {
        const el = document.createElement('div');
        if (wrap.classList.contains('card')) {
          const body = document.createElement('div');
          body.className = `sc-body ${FRAME[w.type] || ''}`;
          body.append(el);
          wrap.append(body);
        } else wrap.append(el);
        MOUNT[w.type](el, ENTRY.get(w.id));
      },
    });
    document.getElementById('favicon').src = document.querySelector('link[rel=icon]')?.href
      || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232A1958'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='3'%3E%3Crect x='11.5' y='11.5' width='17' height='17' rx='5'/%3E%3Crect x='11.5' y='35.5' width='17' height='17' rx='5'/%3E%3Crect x='35.5' y='35.5' width='17' height='17' rx='5'/%3E%3C/g%3E%3Cpath d='M44 11Q44 20 53 20Q44 20 44 29Q44 20 35 20Q44 20 44 11Z' fill='%23fff'/%3E%3C/svg%3E";
    document.getElementById('hash').textContent = HASH === '#/' ? '' : HASH;
    if (VIEW === 'light') document.querySelector('.window').classList.add('light');
    if (VIEW === 'kiosk') document.querySelector('.window').classList.add('tablet');
    const CROP = ['sync', 'nightly', 'copy'].includes(VIEW);
    if (CROP) document.body.classList.add('crop');
    // The sync and copy views: once the editor is there, open the Sync dialog, or Copy to… for the chart with Home picked.
    // The nightly view: the front page's edit mode with its Settings open (the backup, the nightly sync, this browser).
    if (VIEW === 'nightly') {
      const open = () => {
        const settings = [...document.querySelectorAll('.wd-bar .wd-btn')].find(b => b.textContent === 'Settings');
        if (!settings) { setTimeout(open, 50); return; }
        settings.click();
        // The sync time on the 24-hour clock: a time field draws it in the browser's own language (US English here).
        const time = () => {
          const input = document.querySelector('.wd-sync-time');
          if (!input || !input.value) { setTimeout(time, 50); return; }
          const value = input.value;
          input.type = 'text';
          input.value = value;
        };
        time();
      };
      open();
    }
    if (VIEW === 'sync' || VIEW === 'copy') {
      const open = () => {
        if (VIEW === 'sync') {
          const pill = document.querySelector('.wd-syncpill');
          if (!pill) { setTimeout(open, 50); return; }
          pill.click();
          return;
        }
        const tools = [...document.querySelectorAll('.wd-tools')].find(x => x.querySelector('.wd-tools-name')?.textContent === COPY_WIDGET);
        if (!tools) { setTimeout(open, 50); return; }
        tools.querySelector('.wd-tool-copy').click();
        const item = [...document.querySelectorAll('.wd-copy .wd-backup-item')].find(x => x.querySelector('.wd-backup-item-name')?.textContent === COPY_TO);
        item?.querySelector('input').click();
      };
      open();
    }
    // The settings and preview views: once the editor is there, open the widget's settings (and Flow Buttons' first button).
    if (VIEW === 'settings' || VIEW === 'preview') {
      document.querySelector('.viewport').classList.add('settings');
      const name = VIEW === 'settings' ? 'Flow Buttons' : 'Chart · Scatter (XY)';
      const open = () => {
        const tools = [...document.querySelectorAll('.wd-tools')].find(x => x.querySelector('.wd-tools-name')?.textContent === name);
        if (!tools) { setTimeout(open, 50); return; }
        tools.querySelector('.wd-tool-settings').click();
        document.querySelector('.wd-dialog .wd-set-head')?.click();
      };
      open();
    }
    // The front page's previews load lazily, so a render caught some of them still loading: load them all at once, and
    // decode them with the page, as a screenshot on a busy box caught some loaded but not yet drawn.
    new MutationObserver(() => {
      for (const img of document.querySelectorAll('img[loading="lazy"]')) { img.loading = 'eager'; img.decoding = 'sync'; }
    }).observe(document.getElementById('app'), { childList: true, subtree: true });

    // The page's size, for the render script, once the page and its fonts are there; the tab shows the page's title.
    document.fonts.ready.then(() => setTimeout(() => {
      document.getElementById('tab-title').textContent = document.title;
      const r = document.body.getBoundingClientRect();
      document.body.dataset.width = String(Math.ceil(r.width));
      document.body.dataset.height = String(Math.ceil(r.height));
      // The dialog's box with 24 px around it, for the close crop (sync, nightly, copy).
      const dialog = CROP && document.querySelector('.viewport > .wd-dialog');
      if (dialog) {
        const b = dialog.getBoundingClientRect();
        const pad = 24;
        document.body.dataset.crop = [b.left - r.left - pad, b.top - r.top - pad, b.width + 2 * pad, b.height + 2 * pad].map(Math.round).join(',');
      }
    }, 800));
  </script>
</body>
</html>
