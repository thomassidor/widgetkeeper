<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stacked widget preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/spacer/public/kit.css">
  <link rel="stylesheet" href="../widgets/electricity/public/chart.css">
  <link rel="stylesheet" href="../widgets/stacked/public/widget.css">
  <script src="../widgets/spacer/public/kit.js"></script>
  <script src="../widgets/electricity/public/chart.js"></script>
  <script src="../widgets/stacked/public/widget.js"></script>
  <script src="mock-stacked.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="preview.css">
  <style>
    .card { background: var(--homey-background-color, #1F2029); border-radius: 20px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.3); box-sizing: border-box; }
    .light { color: var(--ew-text); }
  </style>
</head>
<body>
  <div class="col"><span>358 px (phone) · dark · 24 hours · meter, heat pump, oven, EV</span><div class="card homey-dark-mode" style="width:358px"><div id="u1"></div></div></div>
  <div class="col"><span>358 px · light · bars · legend below</span><div class="card light" style="width:358px"><div id="u2"></div></div></div>
  <div class="col"><span>300 px · dark · Vivid · tapped on load</span><div class="card homey-dark-mode" style="width:300px"><div id="u3"></div></div></div>
  <div class="col"><span>358 px · dark · solar below zero · no total</span><div class="card homey-dark-mode" style="width:358px"><div id="u4"></div></div></div>
  <div class="col"><span>358 px · dark · today · a missing layer</span><div class="card homey-dark-mode" style="width:358px"><div id="u5"></div></div></div>
  <div class="col"><span>358 px · nothing picked</span><div class="card homey-dark-mode" style="width:358px"><div id="u6"></div></div></div>

  <script>
    const COLORS = ['orange', 'red', 'green', 'yellow'];
    const make = (id, opts, state) => {
      const w = createStackedWidget(document.getElementById(id), { t: devT, language: 'en', colors: COLORS, ...opts });
      if (state) w.setState(state);
      return w;
    };
    make('u1', { total: true, count: 3 }, mockStacked.stackedState());
    make('u2', { total: true, count: 3, style: 'bars', legend: 'below' }, mockStacked.stackedState());
    make('u3', { total: true, count: 3, colorStyle: 'deep' }, mockStacked.stackedState());
    const svg = document.querySelector('#u3 svg');
    const r = svg.getBoundingClientRect();
    svg.dispatchEvent(new PointerEvent('pointerdown', { clientX: r.left + 38 + 258 * 0.9, clientY: r.top + 60, pointerType: 'mouse' }));
    make('u4', { count: 2, colors: ['orange', 'yellow'] }, mockStacked.stackedState('24h', Date.now(), { total: false, ids: ['heatpump', 'solar'] }));
    make('u5', { total: true, count: 3, span: '1d!' }, (() => { const s = mockStacked.stackedState('1d!'); s[2] = { deviceId: 'gone', capabilityId: 'measure_power', missing: true }; return s; })());
    const empty = make('u6', {});
    empty.setMessage(empty.t('selectValues'));
  </script>
</body>
</html>
