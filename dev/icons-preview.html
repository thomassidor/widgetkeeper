<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Icon list</title>
  <script src="../widgets/spacer/public/kit.js"></script>
  <script>window.KIT_ICONS = Object.keys(WidgetkeeperKit.icons);</script>
  <script src="../widgets/spacer/public/icons.js"></script>
  <style>
    body { margin: 0; padding: 20px; background: #1F2029; color: #E4E4E7; font: 13px/16px Roboto, system-ui, sans-serif; }
    h1 { font-size: 17px; margin: 18px 0 10px; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 14px 6px; }
    .icon { display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; }
    .tile { width: 40px; height: 40px; border-radius: 50%; background: #2F8DF6; display: grid; place-items: center; }
    svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    path.filled { fill: #fff; stroke: none; }
  </style>
</head>
<body>
  <script type="module">
    // Every icon the icon settings offer, the kit's above those from Lucide, by the names in en.json (`?lang=de`).
    const lang = new URLSearchParams(location.search).get('lang') || 'en';
    const names = (await (await fetch(`../locales/${lang}.json`)).json()).flows.icons;
    const icons = WidgetkeeperKit.icons;
    const section = (title, ids) => {
      document.body.insertAdjacentHTML('beforeend', `<h1>${title} (${ids.length})</h1>`);
      const grid = document.body.appendChild(Object.assign(document.createElement('div'), { className: 'grid' }));
      for (const id of [...ids].sort((a, b) => names[a].localeCompare(names[b], lang))) {
        grid.insertAdjacentHTML('beforeend', `<div class="icon"><div class="tile"><svg viewBox="0 0 24 24"><path d="${icons[id].d}" ${icons[id].fill ? 'class="filled"' : ''}/></svg></div><span dir="auto">${names[id]}</span></div>`);
      }
    };
    section('The list with nothing typed', KIT_ICONS);
    section('Found by searching (Lucide)', Object.keys(icons).filter(id => !KIT_ICONS.includes(id)));
  </script>
</body>
</html>
