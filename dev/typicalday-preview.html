<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typical Day widget preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/spacer/public/kit.css">
  <link rel="stylesheet" href="../widgets/electricity/public/chart.css">
  <link rel="stylesheet" href="../widgets/typicalday/public/widget.css">
  <script src="../widgets/spacer/public/kit.js"></script>
  <script src="../widgets/electricity/public/chart.js"></script>
  <script src="../widgets/typicalday/public/widget.js"></script>
  <script src="mock-typicalday.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="preview.css">
  <style>
    .card { background: var(--homey-background-color, #1F2029); border-radius: 20px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.3); box-sizing: border-box; }
    .light { color: var(--ew-text); }
  </style>
</head>
<body>
  <div class="col"><span>358 px (phone) · dark · the last 7 days</span><div class="card homey-dark-mode" style="width:358px"><div id="u1"></div></div></div>
  <div class="col"><span>358 px · light · the last 3 days · green · smooth</span><div class="card light" style="width:358px"><div id="u2"></div></div></div>
  <div class="col"><span>300 px · dark · Vivid · tapped at 18:00</span><div class="card homey-dark-mode" style="width:300px"><div id="u3"></div></div></div>
  <div class="col"><span>358 px · dark · no spread · from zero · own title</span><div class="card homey-dark-mode" style="width:358px"><div id="u4"></div></div></div>
  <div class="col"><span>358 px · dark · no history · missing value</span><div class="card homey-dark-mode" style="width:358px"><div id="u5"></div><div style="height:16px"></div><div id="u6"></div></div></div>
  <div class="col"><span>358 px · nothing picked</span><div class="card homey-dark-mode" style="width:358px"><div id="u7"></div></div></div>

  <script>
    const make = (id, opts) => createTypicalDayWidget(document.getElementById(id), { t: devT, language: 'en', ...opts });
    make('u1', {}).setState(mockTypicalDay.typicalDayState(7));
    make('u2', { usual: '3', color: 'green', smooth: true }).setState(mockTypicalDay.typicalDayState(3));
    make('u3', { colorStyle: 'deep' }).setState(mockTypicalDay.typicalDayState(7));
    const svg = document.querySelector('#u3 svg');
    const r = svg.getBoundingClientRect();
    svg.dispatchEvent(new PointerEvent('pointerdown', { clientX: r.left + 38 + (r.width - 42) * 18.5 / 24, pointerType: 'mouse' }));
    make('u4', { band: false, range: 'zero', title: 'Whole house' }).setState(mockTypicalDay.typicalDayState(7));
    const [today, past] = mockTypicalDay.typicalDayState(7);
    make('u5', {}).setState([{ ...today, points: [] }, { ...past, points: [] }]);
    make('u6', { title: 'Garage' }).setState([{ deviceId: 'gone', capabilityId: 'measure_power', missing: true }, null]);
    const empty = make('u7', {});
    empty.setMessage(empty.t('selectValue'));
  </script>
</body>
</html>
