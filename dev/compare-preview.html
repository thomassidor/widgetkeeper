<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare widget preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/spacer/public/kit.css">
  <link rel="stylesheet" href="../widgets/electricity/public/chart.css">
  <link rel="stylesheet" href="../widgets/compare/public/widget.css">
  <script src="../widgets/spacer/public/kit.js"></script>
  <script src="../widgets/electricity/public/chart.js"></script>
  <script src="../widgets/compare/public/widget.js"></script>
  <script src="mock-compare.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="preview.css">
  <style>
    .card { background: var(--homey-background-color, #1F2029); border-radius: 20px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.3); box-sizing: border-box; }
    .light { color: var(--ew-text); }
  </style>
</head>
<body>
  <div class="col"><span>358 px (phone) · dark · six rooms today, highest first</span><div class="card homey-dark-mode" style="width:358px"><div id="u1"></div></div></div>
  <div class="col"><span>358 px · light · lowest first · green</span><div class="card light" style="width:358px"><div id="u2"></div></div></div>
  <div class="col"><span>300 px · dark · Vivid · tapped on load</span><div class="card homey-dark-mode" style="width:300px"><div id="u3"></div></div></div>
  <div class="col"><span>358 px · dark · as picked · no range · own title · three rooms</span><div class="card homey-dark-mode" style="width:358px"><div id="u4"></div></div></div>
  <div class="col"><span>358 px · dark · a missing value</span><div class="card homey-dark-mode" style="width:358px"><div id="u5"></div></div></div>
  <div class="col"><span>358 px · nothing picked</span><div class="card homey-dark-mode" style="width:358px"><div id="u6"></div></div></div>

  <script>
    const make = (id, opts, state) => {
      const w = createCompareWidget(document.getElementById(id), { t: devT, language: 'en', count: state ? state.length : 1, ...opts });
      if (state) w.setState(state);
      return w;
    };
    make('u1', {}, mockCompare.compareState());
    make('u2', { sort: 'low', color: 'green' }, mockCompare.compareState());
    make('u3', { colorStyle: 'deep' }, mockCompare.compareState());
    const svg = document.querySelector('#u3 svg');
    const r = svg.getBoundingClientRect();
    svg.dispatchEvent(new PointerEvent('pointerdown', { clientX: r.left + 150, clientY: r.top + 36 + 26 * 2.5, pointerType: 'mouse' }));
    make('u4', { sort: 'listed', showRange: false, title: 'Downstairs' }, mockCompare.compareState('1d!', Date.now(), 3));
    make('u5', {}, [{ deviceId: 'gone', capabilityId: 'measure_temperature', missing: true }, ...mockCompare.compareState('1d!', Date.now(), 3)]);
    const empty = make('u6', {});
    empty.setMessage(empty.t('selectValues'));
  </script>
</body>
</html>
