<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Range widget preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/spacer/public/kit.css">
  <link rel="stylesheet" href="../widgets/electricity/public/chart.css">
  <link rel="stylesheet" href="../widgets/dailyrange/public/widget.css">
  <script src="../widgets/spacer/public/kit.js"></script>
  <script src="../widgets/electricity/public/chart.js"></script>
  <script src="../widgets/dailyrange/public/widget.js"></script>
  <script src="mock-dailyrange.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="preview.css">
  <style>
    .card { background: var(--homey-background-color, #1F2029); border-radius: 20px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.3); box-sizing: border-box; }
    .light { color: var(--ew-text); }
  </style>
</head>
<body>
  <div class="col"><span>358 px (phone) · dark · the last 4 weeks (default)</span><div class="card homey-dark-mode" style="width:358px"><div id="u1"></div></div></div>
  <div class="col"><span>358 px · light · the last 14 days · yellow</span><div class="card light" style="width:358px"><div id="u2"></div></div></div>
  <div class="col"><span>300 px · dark · last week · Vivid · tapped on load</span><div class="card homey-dark-mode" style="width:300px"><div id="u3"></div></div></div>
  <div class="col"><span>358 px · dark · 24 hours, a bar an hour · no average · from zero · own title</span><div class="card homey-dark-mode" style="width:358px"><div id="u4"></div></div></div>
  <div class="col"><span>358 px · dark · no history · missing value</span><div class="card homey-dark-mode" style="width:358px"><div id="u5"></div><div style="height:16px"></div><div id="u6"></div></div></div>
  <div class="col"><span>358 px · nothing picked</span><div class="card homey-dark-mode" style="width:358px"><div id="u7"></div></div></div>

  <script>
    const make = (id, opts) => createDailyRangeWidget(document.getElementById(id), { t: devT, language: 'en', ...opts });
    make('u1', {}).setState(mockDailyRange.dailyRangeState('4w'));
    make('u2', { span: '14d', color: 'yellow' }).setState(mockDailyRange.dailyRangeState('14d'));
    make('u3', { span: '1w!-', colorStyle: 'deep' }).setState(mockDailyRange.dailyRangeState('1w!-'));
    const svg = document.querySelector('#u3 svg');
    const r = svg.getBoundingClientRect();
    svg.dispatchEvent(new PointerEvent('pointerdown', { clientX: r.left + 38 + (r.width - 42) * 2.5 / 7, pointerType: 'mouse' }));
    make('u4', { span: '24h', average: false, range: 'zero', title: 'Outside, today' }).setState(mockDailyRange.dailyRangeState('24h'));
    const [value] = mockDailyRange.dailyRangeState('4w');
    make('u5', {}).setState([{ ...value, points: [], value: null }]);
    make('u6', { title: 'Garden' }).setState([{ deviceId: 'gone', capabilityId: 'measure_temperature', missing: true }]);
    const empty = make('u7', {});
    empty.setMessage(empty.t('selectValue'));
  </script>
</body>
</html>
