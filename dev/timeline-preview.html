<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline widget preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../widgets/spacer/public/kit.css">
  <link rel="stylesheet" href="../widgets/electricity/public/chart.css">
  <link rel="stylesheet" href="../widgets/timeline/public/widget.css">
  <script src="../widgets/spacer/public/kit.js"></script>
  <script src="../widgets/electricity/public/chart.js"></script>
  <script src="../widgets/timeline/public/widget.js"></script>
  <script src="mock-timeline.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="preview.css">
  <style>
    .card { background: var(--homey-background-color, #1F2029); border-radius: 20px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.3); box-sizing: border-box; }
    .light { color: var(--ew-text); }
  </style>
</head>
<body>
  <div class="col"><span>358 px (phone) · dark · today</span><div class="card homey-dark-mode" style="width:358px"><div id="u1"></div></div></div>
  <div class="col"><span>358 px · light · own colours · a title</span><div class="card light" style="width:358px"><div id="u2"></div></div></div>
  <div class="col"><span>300 px · dark · Vivid · a band tapped on load</span><div class="card homey-dark-mode" style="width:300px"><div id="u3"></div></div></div>
  <div class="col"><span>358 px · dark · the last 7 days</span><div class="card homey-dark-mode" style="width:358px"><div id="u4"></div></div></div>
  <div class="col"><span>358 px · dark · a missing value · recorded only since 14:00</span><div class="card homey-dark-mode" style="width:358px"><div id="u5"></div></div></div>
  <div class="col"><span>358 px · nothing picked</span><div class="card homey-dark-mode" style="width:358px"><div id="u6"></div></div></div>

  <script>
    const make = (id, opts, state) => {
      const w = createTimelineWidget(document.getElementById(id), { t: devT, language: 'en', ...opts });
      if (state) w.setState(state);
      return w;
    };
    make('u1', {}, mockTimeline.timelineState());
    make('u2', { colors: ['orange', 'yellow', 'red', 'blue'], title: 'Downstairs' }, mockTimeline.timelineState());
    make('u3', { colorStyle: 'deep', colors: ['orange', 'yellow', 'red', 'blue'] }, mockTimeline.timelineState());
    const svg = document.querySelector('#u3 svg');
    const r = svg.getBoundingClientRect();
    svg.dispatchEvent(new PointerEvent('pointerdown', { clientX: r.left + r.width * 18.5 / 24, clientY: r.top + 2 + 32 * 3 + 22, pointerType: 'mouse' }));
    make('u4', { span: '7d' }, mockTimeline.timelineState('7d'));
    const late = mockTimeline.timelineState('1d!', Date.now(), 2).map(row => {
      const since = new Date().setHours(14, 0, 0, 0);
      return { ...row, since, changes: row.changes.filter(c => c[0] >= since) };
    });
    make('u5', {}, [{ deviceId: 'gone', capabilityId: 'onoff', missing: true }, ...late]);
    const empty = make('u6', {});
    empty.setMessage(empty.t('selectValues'));
  </script>
</body>
</html>
